; Defence in depth for CVE-2026-109618 / CVE-2026-109619 (PHP2Shell).
; The real fix is the PHP version pinned in the Dockerfile.

; Let the container memory limit (40Mi in k8s-quote.tf) be the boundary
; instead of PHP's own allocation failure path.
memory_limit = -1

; Blocks the confirmed session-based path for CVE-2026-109619.
session.upload_progress.enabled = 0
